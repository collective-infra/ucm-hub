# ---------------- GLOBAL AGENT SETTINGS ----------------
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "ucm-hub"
  omit_hostname = false

# ---------------- OUTPUT: INFLUXDB 2.0 ----------------
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token ="bQD57FX3f-0Yz17lImhqxLcdOiQ4wnMqIzM40tOoMfaPI-Kyxv53ZiGERPFP8n71VEjvg1Nk0l0RzppVmSskeA=="
   organization = "NYC-Mesh-Project"
  bucket = "Microclimate-Data"

# ---------------- INPUT: MQTT SENSOR ----------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]
  
  # We use the wildcard '#' to catch any sensor ID (sen54, sen55, etc.)
  topics = ["ucm/sensors/#"] 
  
  # This tells Telegraf to interpret your Python dictionary as data
  data_format = "json"
  
  # Matches the keys in your Python code (pm25, temp, rh, etc.)
  tag_keys = [ 
      "node",
      "borough"
   ]
  json_name_key = "air_quality_metrics"
  json_time_key = "timestamp"
  json_time_format = "unix"
